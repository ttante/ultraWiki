services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ultrawiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultrawiki}
      POSTGRES_DB: ${POSTGRES_DB:-ultrawiki}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ultrawiki} -d ${POSTGRES_DB:-ultrawiki}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_PORT: ${API_PORT:-4000}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      MIGRATIONS_DIR: /infra/sql/migrations
      DATABASE_URL: ${DATABASE_URL:-postgresql://ultrawiki:ultrawiki@postgres:5432/ultrawiki}
      WORKER_URL: http://worker:${WORKER_PORT:-8000}
      JOB_CONCURRENCY_LIMIT: ${JOB_CONCURRENCY_LIMIT:-2}
      SESSION_CONCURRENCY_LIMIT: ${SESSION_CONCURRENCY_LIMIT:-1}
      MAX_QUEUE_DEPTH: ${MAX_QUEUE_DEPTH:-100}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-3600}
      TOKEN_BUDGET_PER_JOB: ${TOKEN_BUDGET_PER_JOB:-40000}
      LATENCY_BUDGET_MS: ${LATENCY_BUDGET_MS:-30000}
      WIKIPEDIA_LANG: ${WIKIPEDIA_LANG:-en}
      LLM_PROVIDER: ${LLM_PROVIDER:-rule_based}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-14b-instruct-q4_k_m}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
    ports:
      - "${API_HOST_PORT:-4000}:${API_PORT:-4000}"
    volumes:
      - ./infra/sql:/infra/sql:ro
      - ./infra/prompts:/repo/infra/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_BASE_URL: http://api:${API_PORT:-4000}
      NEXT_PUBLIC_API_BASE_URL: http://api:${API_PORT:-4000}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api

  worker:
    build:
      context: ./worker
    environment:
      WORKER_PORT: ${WORKER_PORT:-8000}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080/v1}
      TOKEN_BUDGET_PER_JOB: ${TOKEN_BUDGET_PER_JOB:-40000}
      LATENCY_BUDGET_MS: ${LATENCY_BUDGET_MS:-30000}
    ports:
      - "${WORKER_HOST_PORT:-8000}:${WORKER_PORT:-8000}"

  llm:
    build:
      context: ./infra/llm-mock
    ports:
      - "${LLM_HOST_PORT:-8080}:8080"

  llama:
    image: ghcr.io/ggerganov/llama.cpp:server
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/qwen2.5-14b-instruct-q4_k_m.gguf", "-c", "4096", "-ngl", "100"]
    volumes:
      - ./models:/models
    ports:
      - "${LLAMA_HOST_PORT:-8080}:8080"
    gpus: all
    profiles: ["llama"]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --log.level=info
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    profiles: ["monitoring"]

  pushgateway:
    image: prom/pushgateway:v1.8.0
    ports:
      - "9091:9091"
    profiles: ["monitoring"]

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - alertmanager
      - pushgateway
    profiles: ["monitoring"]

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --workspaces
      - run: python -m pip install -r worker/requirements.txt
      - run: python -m pytest worker/tests
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run gate:tdd-proof
      - run: npm run gate:coverage
      - run: npm run gate:contracts
      - run: npm run gate:golden-set
      - run: npm run gate:bench-regression
      - run: npm run gate:migration-safety
      - run: npm run gate:monitoring-config
      - run: npm run gate:alert-policy
      - run: npm run gate:outcomes-maintenance
